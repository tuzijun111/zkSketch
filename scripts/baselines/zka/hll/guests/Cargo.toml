# Guest workspace. Built by risc0-build (methods/build.rs) with --locked when
# RISC0_BUILD_LOCKED=1; Cargo.lock here was derived from zk-Analytics' own lock
# (d4a5a9a), so the guests link the same risc0-zkvm (3.0.5) and crate versions as theirs.
[workspace]
resolver = "2"
members = ["aggr", "query", "aggr_root"]
