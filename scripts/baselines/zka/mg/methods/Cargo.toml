[package]
name = "mg-methods"
version = "0.1.0"
edition = "2021"
build = "build.rs"

# aggr_mg / query_mg are the measured guests (`legacy` root variant). The *_prof guests run the same mg-core code with env::cycle_count()
# markers between phases; they are used only for the phase breakdown, never for a
# headline number. aggr_mg_rootvar runs the same aggregation with a run-time choice
# of Merkle-root construction: the six-sketch designed (Buckets64) and noroot (None)
# aggregation rows, and the buckets1024 / perkey sensitivity rows.
[package.metadata.risc0]
methods = ["guests/aggr_mg", "guests/query_mg", "guests/aggr_mg_prof", "guests/query_mg_prof", "guests/aggr_mg_rootvar"]

[build-dependencies]
risc0-build = "3"

[dependencies]
risc0-zkvm = "3"
