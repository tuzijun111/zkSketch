[package]
name = "gk-matched-core"
version = "0.1.0"
edition = "2021"

# zk-Analytics' aggregation / query pipeline (their aggregator-core and querier-core,
# the same dependency set and features as ../../gk/core) around zkSketch's GK batch
# rule: the default implementation `tuned` is defined here (apply_epoch_tuned); the
# literal / fast / fixed_linear ports of apply_batch2, the gk_vals_of mapping and the
# state word encoding come from ../../gk_bm2/core unchanged. No Poseidon, no sorting
# certificates, no memory checking: plain Rust.
[dependencies]
rust_crypto = { package = "sha2", version = "0.10", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
hashbrown = { version = "0.14", default-features = false, features = ["ahash", "inline-more", "alloc"] }
risc0-zkvm = { version = "3", default-features = false }
zkvm-common = { path = "../../.zka/zkvm-common", default-features = false }
aggregator-core = { path = "../../.zka/aggregator/core", default-features = false }
querier-core = { path = "../../.zka/querier/core", default-features = false }
gk-bm2-core = { path = "../../gk_bm2/core", default-features = false }
bytemuck = { version = "1", default-features = false }

[features]
default = ["std"]
std = ["serde/std", "zkvm-common/std", "aggregator-core/std", "querier-core/std", "gk-bm2-core/std"]
