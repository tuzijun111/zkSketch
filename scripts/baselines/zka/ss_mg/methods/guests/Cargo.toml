# Guest workspace. Its Cargo.lock was seeded from
# ../../../spacesaving/methods/guests/Cargo.lock (itself seeded from the
# zk-Analytics clone's Cargo.lock at d4a5a9a) and pruned by cargo, so every
# crate shared with their guests (risc0-zkvm 3.0.5, sha2, serde, bytemuck, ...)
# is the same version. No [profile] section: like the clone's root workspace,
# guests build with cargo's default release profile (risc0-build passes --release).
[workspace]
members = ["ss_mg", "ss_mg_serde"]
resolver = "2"
