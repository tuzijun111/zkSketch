# Host-side workspace: the transition port (core), the methods crate that embeds
# the guest ELF, and the host driver. The guest lives in its own workspace
# (guests/) so it resolves from a lock seeded from ../gk/guests/Cargo.lock
# (risc0-zkvm 3.0.5, as the other zka guests), while the host resolves from a lock
# seeded from ../gk/Cargo.lock (risc0-zkvm 3.0.6) plus the zkSketch crate this
# directory sits in (path dependency, for the native equivalence check).
[workspace]
members = ["core", "methods", "host"]
exclude = ["guests"]
resolver = "2"

[profile.release]
opt-level = 3
