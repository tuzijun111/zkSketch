[package]
name = "zksketch"
version = "0.1.0"
edition = "2024"
description = "Recursive ZKP experiments based on the zkSketch paper, built on plonky3"
license = "MIT OR Apache-2.0"

[dependencies]
# Plonky3 core, pinned to the rev used by plonky3-recursion's workspace.
# The `parallel` feature on the crates that support it pulls in Rayon so the
# STARK prover scales across CPU cores; `bench_v3_prover` in
# `src/sketch/countmin_v3.rs` lets callers cap the thread count per call via
# a custom `rayon::ThreadPool`.
p3-air         = { git = "https://github.com/Plonky3/Plonky3", rev = "56952503e1401a62982ceaf952c5e4a829b61803" }
p3-baby-bear   = { git = "https://github.com/Plonky3/Plonky3", rev = "56952503e1401a62982ceaf952c5e4a829b61803" }
p3-batch-stark = { git = "https://github.com/Plonky3/Plonky3", rev = "56952503e1401a62982ceaf952c5e4a829b61803", features = ["parallel"] }
p3-challenger  = { git = "https://github.com/Plonky3/Plonky3", rev = "56952503e1401a62982ceaf952c5e4a829b61803" }
p3-commit      = { git = "https://github.com/Plonky3/Plonky3", rev = "56952503e1401a62982ceaf952c5e4a829b61803" }
p3-dft         = { git = "https://github.com/Plonky3/Plonky3", rev = "56952503e1401a62982ceaf952c5e4a829b61803", features = ["parallel"] }
p3-field       = { git = "https://github.com/Plonky3/Plonky3", rev = "56952503e1401a62982ceaf952c5e4a829b61803" }
p3-goldilocks  = { git = "https://github.com/Plonky3/Plonky3", rev = "56952503e1401a62982ceaf952c5e4a829b61803" }
p3-fri         = { git = "https://github.com/Plonky3/Plonky3", rev = "56952503e1401a62982ceaf952c5e4a829b61803" }
p3-lookup      = { git = "https://github.com/Plonky3/Plonky3", rev = "56952503e1401a62982ceaf952c5e4a829b61803", features = ["parallel"] }
p3-matrix      = { git = "https://github.com/Plonky3/Plonky3", rev = "56952503e1401a62982ceaf952c5e4a829b61803" }
p3-merkle-tree = { git = "https://github.com/Plonky3/Plonky3", rev = "56952503e1401a62982ceaf952c5e4a829b61803" }
p3-poseidon2   = { git = "https://github.com/Plonky3/Plonky3", rev = "56952503e1401a62982ceaf952c5e4a829b61803" }
p3-symmetric   = { git = "https://github.com/Plonky3/Plonky3", rev = "56952503e1401a62982ceaf952c5e4a829b61803" }
p3-uni-stark   = { git = "https://github.com/Plonky3/Plonky3", rev = "56952503e1401a62982ceaf952c5e4a829b61803", features = ["parallel"] }
p3-util        = { git = "https://github.com/Plonky3/Plonky3", rev = "56952503e1401a62982ceaf952c5e4a829b61803", features = ["parallel"] }

# Plonky3-recursion: in-circuit STARK verifier for the merge atom.
# Sourced from a fork that adds D > 1 PermuteAir support (Phase 8d patch) plus
# the ExposeAir and RangeAir (byte-table LogUp range check) non-primitive ops;
# necessary for this project's PermuteAir + Recompose + Poseidon2 combined
# circuits at extension degree D = 4. Upstream Plonky3-recursion at the
# parent commit (524665d) only exercises D = 1 and panics for D > 1.
p3-recursion             = { git = "https://github.com/tuzijun111/Plonky3_RangeAir", rev = "e08a370e9e6bdcc873157c2edb12a6c50d413701" }
p3-circuit               = { git = "https://github.com/tuzijun111/Plonky3_RangeAir", rev = "e08a370e9e6bdcc873157c2edb12a6c50d413701" }
p3-circuit-prover        = { git = "https://github.com/tuzijun111/Plonky3_RangeAir", rev = "e08a370e9e6bdcc873157c2edb12a6c50d413701", features = ["parallel"] }
p3-poseidon2-circuit-air = { git = "https://github.com/tuzijun111/Plonky3_RangeAir", rev = "e08a370e9e6bdcc873157c2edb12a6c50d413701", features = ["parallel"] }

postcard           = { version = "1.1", features = ["alloc"] }
rand               = "0.10"
rayon              = "1.10"
serde              = { version = "1.0", features = ["derive"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# NOTE: The four Plonky3-recursion crates above are pulled from a GitHub fork
# (https://github.com/tuzijun111/Plonky3_RangeAir) that adds D > 1 PermuteAir,
# ExposeAir, and RangeAir support — no local clone needed for a fresh checkout.
# If you want to edit the fork against this project (faster iteration), copy
# `.cargo/config.toml.example` to `.cargo/config.toml` and adjust the paths to
# point at a local clone of the fork; the `[patch]` section there overrides the
# GitHub deps.
