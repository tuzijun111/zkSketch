[package]
name = "zksketch_snark"
version = "0.1.0"
edition = "2021"
description = "SNARK (plonky2) re-implementation of the zkSketch recursive sketch-proof framework"
license = "MIT OR Apache-2.0"

[dependencies]
# plonky2: PLONK-ish arithmetization + FRI over Goldilocks, with first-class
# recursion. This is the "SNARK" backend standing in for the plonky3 +
# plonky3-recursion STARK stack used by ../zkSketch.
#
# NOTE: both the crates.io release and git `main` need nightly
# (`#![feature(specialization)]`; see rust-toolchain.toml). Pinned to the exact
# commit the results were measured at.
plonky2 = { git = "https://github.com/tuzijun111/plonky2", rev = "66427b0ed22d7fe36f575adc117b745a2c8f75f4" }
anyhow = "1.0"
# Used only to report the prover thread count in the benchmark output, matching
# the plonky3 `countmin_final` benchmarks. plonky2 already depends on rayon.
rayon = "1.10"
# Distributed composition engine (experiments::dist_compose): the cross-process
# wire codec for subtree-root proofs (proof + CommonCircuitData + verifier-only
# bytes) and the socket IPC framing. Matches the plonky3 crate's versions.
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1.1", features = ["alloc"] }

[features]
# Zero-knowledge proofs (plonky2 `zero_knowledge`: blinding rows plus salted
# Merkle caps) for every circuit; mirrors the root crate's `zk`. On by default;
# `--no-default-features` gives the plain (non-hiding) proofs. See src/config.rs.
# `zk` is only meaningful with plonky2's Z-blinding fix (at the pinned rev,
# `blind()` uses `generate_copy` instead of `connect`, so Z and the partial
# products are not blinded). Without the fix it fails closed:
# `config::build_circuit` panics on every zk circuit, and tests/zk_blinding.rs
# fails in both feature modes. Until the fork is pinned here, the fix comes from
# a local, git-ignored .cargo/config.toml [patch] (see README.md).
default = ["zk"]
zk = []

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Proving is far faster in release; tests that touch recursion are slow in dev.
# Keep our crate at low opt for fast iteration, but compile the heavy plonky2
# dependencies at opt-level 3 so in-circuit proving stays fast under `cargo test`.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
