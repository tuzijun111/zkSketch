# Local, gitignored cargo config.
#
# Route cargo's dependency git fetches through the system `git` CLI instead of
# the built-in libgit2 client. libgit2's anonymous fetch of the PUBLIC fork
# github.com/July620/Plonky3_RangeAir intermittently fails with a spurious
# "failed to authenticate" (a transient GitHub 401/rate-limit that libgit2
# reports as an auth error). The system git CLI fetches the same public repo
# reliably, so cargo's own error message recommends this exact setting:
#   https://doc.rust-lang.org/cargo/reference/config.html#netgit-fetch-with-cli
[net]
git-fetch-with-cli = true

# Local `[patch]` override: the fork clone carries the in-progress
# `update_permute_witnesses` addition (branch permute-witness-update, based on
# e08a370) that lets a built circuit be reused across leaf proofs by swapping
# the Permute ops' trace-generation hints. Once that branch is pushed and
# Cargo.toml's rev is bumped to it, this block can be removed again.
[patch."https://github.com/July620/Plonky3_RangeAir"]
p3-recursion             = { path = "/home2/binbin/Plonky3_RangeAir/recursion" }
p3-circuit               = { path = "/home2/binbin/Plonky3_RangeAir/circuit" }
p3-circuit-prover        = { path = "/home2/binbin/Plonky3_RangeAir/circuit-prover" }
p3-poseidon2-circuit-air = { path = "/home2/binbin/Plonky3_RangeAir/poseidon2-circuit-air" }
